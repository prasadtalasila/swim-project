# swim-project configuration. Replace every example value; README.md,
# section Configure, describes each key. Keep this file private: it holds
# two passwords. No interpolation: a % is literal.

[database]
hostname=db.example.org
port=5432
db_name=sensors
username=recorder
password=change-me

[mqtt]
host=broker.example.org
port=8883
# Leave username and password out for an anonymous broker.
username=recorder
password=change-me
# TLS is on unless set to false (for a local test broker).
tls=true
# Topic filters to record, one per line, indented; MQTT wildcards + and #
# allowed. `record --topic` replaces the whole list for one run.
topics=
    site-a/building-1/room/101/+/S/+/+
    site-a/building-1/room/102/#
